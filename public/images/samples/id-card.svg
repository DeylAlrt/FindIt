<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <!-- Table background -->
  <rect width="600" height="450" fill="#8a6a4a"/>
  <rect width="600" height="450" fill="url(#grain)" opacity="0.25"/>
  <defs>
    <pattern id="grain" width="600" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9 Q150 3 300 9 T600 9" stroke="#5e4630" stroke-width="2" fill="none"/>
    </pattern>
  </defs>

  <!-- Card (slightly turned, with a shadow) -->
  <g transform="rotate(-6 300 225)">
    <rect x="118" y="108" width="380" height="240" rx="18" fill="#000" opacity="0.3"/>
    <rect x="110" y="98" width="380" height="240" rx="18" fill="#ffffff"/>
    <rect x="110" y="98" width="380" height="58" rx="18" fill="#1a1a1a"/>
    <rect x="110" y="138" width="380" height="18" fill="#1a1a1a"/>
    <text x="134" y="136" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffd23f">CAMPUS UNIVERSITY</text>

    <!-- Photo placeholder (no real person) -->
    <rect x="134" y="176" width="100" height="124" rx="8" fill="#e6e6e6"/>
    <circle cx="184" cy="222" r="26" fill="#b5b5b5"/>
    <path d="M144 300 Q184 246 224 300 Z" fill="#b5b5b5"/>

    <!-- Fake details -->
    <text x="254" y="196" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">STUDENT ID</text>
    <rect x="254" y="212" width="190" height="12" rx="6" fill="#cfcfcf"/>
    <rect x="254" y="236" width="150" height="12" rx="6" fill="#cfcfcf"/>
    <rect x="254" y="260" width="170" height="12" rx="6" fill="#cfcfcf"/>

    <!-- Barcode -->
    <g fill="#1a1a1a">
      <rect x="254" y="284" width="4" height="30"/><rect x="262" y="284" width="2" height="30"/>
      <rect x="268" y="284" width="6" height="30"/><rect x="278" y="284" width="2" height="30"/>
      <rect x="284" y="284" width="4" height="30"/><rect x="292" y="284" width="2" height="30"/>
      <rect x="298" y="284" width="6" height="30"/><rect x="308" y="284" width="4" height="30"/>
      <rect x="316" y="284" width="2" height="30"/><rect x="322" y="284" width="6" height="30"/>
      <rect x="332" y="284" width="2" height="30"/><rect x="338" y="284" width="4" height="30"/>
      <rect x="346" y="284" width="2" height="30"/><rect x="352" y="284" width="6" height="30"/>
    </g>
    <rect x="458" y="300" width="18" height="18" rx="4" fill="#ffd23f"/>
  </g>
</svg>
